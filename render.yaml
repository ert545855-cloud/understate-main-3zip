services:
  - type: web
    name: understate
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: node server/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT, Render tarafından otomatik olarak inject edilir — sabit değer girmeyin.
      - key: DATABASE_URL
        sync: false    # Dashboard'dan girilir (Render Postgres "Internal Database URL" ya da Supabase). Yoksa sunucu açılır ama kayıt tutmaz.
      - key: JWT_SECRET
        generateValue: true   # Render rastgele güçlü bir anahtar üretir (mevcut değer varsa korunur)
      - key: NODE_VERSION
        value: "22"
      # PUBLIC_URL / ALLOWED_ORIGINS artık gerekmiyor: sunucu Render adresini (RENDER_EXTERNAL_URL)
      # ve isteğin geldiği alan adını kendisi kullanır. Sabit "understate.onrender.com" değeri,
      # servis farklı bir adla açıldığında socket ve girişin bozulmasına yol açıyordu.
      # Özel alan adı kullanıyorsan Dashboard'dan PUBLIC_URL ekleyebilirsin (e-posta bağlantıları için).
      - key: ADMIN_USERS
        value: admin
      - key: BETA_MODE
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        value: noreply@understate.game
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: GIPHY_API_KEY
        sync: false
